services:
  db:
    image: postgres:17
    container_name: squared-db
    environment:
      POSTGRES_USER: squared
      POSTGRES_PASSWORD: squared_dev_password
      POSTGRES_DB: squared
    ports:
      - "5432:5432"
    volumes:
      - squared-db-data:/var/lib/postgresql/data

volumes:
  squared-db-data: